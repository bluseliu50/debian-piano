name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              shellcheck yamllint

      - name: actionlint
        run: |
          url=https://raw.githubusercontent.com/rhysd/actionlint/main
          url=$url/scripts/download-actionlint.bash
          bash <(curl -fsSL "$url")
          ./actionlint -version

      - name: sh -n syntax checks
        run: |
          sh -n initramfs/init
          for f in scripts/*.sh firmware-xiaomi-piano/*.sh; do
            bash -n "$f"
          done

      - name: shellcheck
        run: |
          shellcheck scripts/*.sh firmware-xiaomi-piano/*.sh
          # initramfs/init targets busybox ash (POSIX sh)
          shellcheck -s sh initramfs/init || {
            echo "::warning::initramfs/init has shellcheck findings under 'sh' mode";
          }

      - name: Python compile checks
        run: |
          python3 -m py_compile mkbootimg/*.py mkbootimg/gki/*.py

      - name: YAML checks
        run: |
          yamllint -d relaxed .github/workflows/
          ./actionlint
