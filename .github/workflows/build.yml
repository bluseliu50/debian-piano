name: build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              debootstrap debian-archive-keyring cpio gzip \
              busybox-static dropbear-bin \
              lz4 python3 zstd

      - name: "Sanity: suite script available"
        run: |
          test -f /usr/share/debootstrap/scripts/trixie \
            || { echo "::error::debootstrap on this runner lacks the trixie suite script"; exit 1; }

      - name: Build initramfs
        run: |
          mkdir -p out
          # busybox-static installs /bin/busybox. Ubuntu splits dropbear
          # binaries across /usr/sbin (dropbear) and /usr/bin (dropbearkey):
          # stage them into one directory for the strict script interface.
          mkdir -p /tmp/dropbear-staging
          ln -sf /usr/sbin/dropbear /tmp/dropbear-staging/dropbear
          ln -sf /usr/bin/dropbearkey /tmp/dropbear-staging/dropbearkey
          scripts/build-initramfs.sh \
            --busybox /bin --dropbear /tmp/dropbear-staging \
            --output out/initramfs-piano.cpio.gz

      - name: Build rootfs (firmware not included)
        run: |
          set +e
          sudo scripts/build-rootfs.sh \
            --suite trixie \
            --output out/rootfs-build
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo '::group::debootstrap.log (tail)'
            sudo tail -n 150 out/rootfs-build/rootfs/debootstrap/debootstrap.log || true
            echo '::endgroup::'
            exit "$rc"
          fi

      - name: Package rootfs tarball
        run: |
          sudo tar --numeric-owner -C out/rootfs-build/rootfs \
              -caf out/rootfs-trixie-arm64.tar.zst .
          sudo chown -R "$(id -u):$(id -g)" out/rootfs-build
          cp out/rootfs-build/build-manifest.txt out/

      - name: Bootimg synthetic smoke (UNVERIFIED params gate)
        run: |
          # Synthetic fixture: the point is parameter passing + pack/unpack
          # round-trip, NOT a bootable image. The gate test runs against a
          # deliberately-UNVERIFIED fixture file; the repo's real params
          # file carries CONFIRMED values from the stock ROM and must never satisfy
          # --allow-unverified smoke inputs by accident.
          mkdir -p out/fixture
          echo 'UNVERIFIED:header_version=4'    >  out/fixture/unverified-params.env
          echo 'UNVERIFIED:pagesize=4096'        >> out/fixture/unverified-params.env
          echo 'UNVERIFIED:ramdisk_compression=gzip' >> out/fixture/unverified-params.env
          head -c 65536 /dev/urandom > out/fixture/kernel
          gunzip -c out/initramfs-piano.cpio.gz > out/fixture/ramdisk.cpio
          cp out/initramfs-piano.cpio.gz out/fixture/initramfs.cpio.gz
          # expect failure without --allow-unverified
          if scripts/build-bootimg.sh \
              --kernel out/fixture/kernel \
              --ramdisk out/fixture/ramdisk.cpio \
              --dtb out/fixture/initramfs.cpio.gz \
              --header-version 4 --pagesize 4096 \
              --ramdisk-compression gzip \
              --output out/fixture/should-not-exist.img; then
            echo "::error::UNVERIFIED gate failed to block a deliverable image"
            exit 1
          fi
          # expect success in synthetic mode with forced prefix
          scripts/build-bootimg.sh \
            --kernel out/fixture/kernel \
            --ramdisk out/fixture/ramdisk.cpio \
            --dtb out/fixture/initramfs.cpio.gz \
            --header-version 4 --pagesize 4096 \
            --ramdisk-compression gzip \
            --params-file out/fixture/unverified-params.env \
            --output out/fixture/boot.img --allow-unverified
          test -f out/fixture/synthetic-boot.img

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: piano-build
          path: |
            out/initramfs-piano.cpio.gz
            out/rootfs-trixie-arm64.tar.zst
            out/build-manifest.txt
            out/fixture/synthetic-boot.img
          retention-days: 7
